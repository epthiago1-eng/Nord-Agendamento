<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",

<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-[#fcfaff]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Registro de SW resiliente a erros de ambiente de desenvolvimento
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(reg => {
              console.log('SW registrado com sucesso:', reg.scope);
              reg.update(); // Força atualização imediata
            })
            .catch(err => {
              // Silencia erros de origem cruzada comuns em previews
              if (!err.message.includes('origin')) {
                console.warn('SW Info:', err.message);
              }
            });
        });
      }
    </script>
</body>
