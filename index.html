
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nord Barber">
    
    <title>Nord Barbershop Manager</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="https://agendamento.igic.com.br/assets/logos/nord_barbershop_logo.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="https://agendamento.igic.com.br/assets/logos/nord_barbershop_logo.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="https://agendamento.igic.com.br/assets/logos/nord_barbershop_logo.png?v=2">
    <link rel="apple-touch-icon" href="https://agendamento.igic.com.br/assets/logos/nord_barbershop_logo.png?v=2">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-[#fcfaff]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Registro de SW resiliente
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Primeiro, tenta desregistrar qualquer SW antigo para limpar o estado do navegador
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
              // Se for o antigo sw.js ou qualquer outro, desregistra
              registration.unregister();
            }
          }).then(() => {
            // Agora registra o novo com um nome diferente para evitar redirecionamentos cacheados
            if (window.location.protocol === 'https:') {
              navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' })
                .then(reg => {
                  console.log('SW registrado com sucesso');
                })
                .catch(err => {
                  console.warn('SW registro falhou:', err.message);
                });
            }
          });
        });
      }
    </script>
</body>
</html>
