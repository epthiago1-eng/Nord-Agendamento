
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nord Barber">
    
    <title>Nord Barbershop Manager</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="https://agendamento.igic.com.br/assets/logos/nord_barbershop_logo.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="https://agendamento.igic.com.br/assets/logos/nord_barbershop_logo.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="https://agendamento.igic.com.br/assets/logos/nord_barbershop_logo.png?v=2">
    <link rel="apple-touch-icon" href="https://agendamento.igic.com.br/assets/logos/nord_barbershop_logo.png?v=2">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-[#fcfaff]">
    <div id="root">
      <!-- Fallback UI: Só aparece se o React falhar ao carregar (ex: erro de cache no JS) -->
      <div style="min-height: 100vh; background-color: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; font-family: 'Inter', sans-serif;">
        <div style="width: 48px; height: 48px; border: 4px solid #3b82f6; border-bottom-color: transparent; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; margin-bottom: 24px;"></div>
        <style>
          @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
        <h2 style="color: white; margin: 0 0 8px 0; font-weight: 900; font-size: 20px;">Carregando...</h2>
        <p style="color: #94a3b8; font-size: 14px; margin: 0 0 24px 0; max-width: 300px;">Se esta tela travar ou ficar branca, clique no botão abaixo para resolver.</p>
        <button onclick="forceClearCache()" style="background-color: white; color: #0f172a; border: none; padding: 16px 24px; border-radius: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; cursor: pointer; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);">Limpar Cache e Recarregar</button>
      </div>
    </div>
    <script>
      function forceClearCache() {
        try {
          localStorage.clear();
          sessionStorage.clear();
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for(var i = 0; i < regs.length; i++) { regs[i].unregister(); }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for(var i = 0; i < names.length; i++) { caches.delete(names[i]); }
            });
          }
          setTimeout(function() { window.location.reload(true); }, 500);
        } catch (e) {
          window.location.reload(true);
        }
      }
    </script>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Registro de SW resiliente
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Primeiro, tenta desregistrar qualquer SW antigo para limpar o estado do navegador
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
              // Se for o antigo sw.js ou qualquer outro, desregistra
              registration.unregister();
            }
          }).then(() => {
            // Agora registra o novo com um nome diferente para evitar redirecionamentos cacheados
            if (window.location.protocol === 'https:') {
              navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' })
                .then(reg => {
                  console.log('SW registrado com sucesso');
                })
                .catch(err => {
                  console.warn('SW registro falhou:', err.message);
                });
            }
          });
        });
      }
    </script>
</body>
</html>
